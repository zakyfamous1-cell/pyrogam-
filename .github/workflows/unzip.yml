name: unzip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -q PythonModules.zip
          cp -r PythonModules-main/. .
          rm -rf PythonModules-main PythonModules.zip
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "add pyrogram patch"
          git push
